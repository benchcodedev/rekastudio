<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" width="100%" height="100%" fill="none">
  <!-- CAD Grid Background -->
  <defs>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F5F9" stroke-width="0.8" />
      <circle cx="0" cy="0" r="0.75" fill="#CBD5E1" />
    </pattern>
  </defs>

  <rect width="520" height="540" fill="url(#cadGrid)" opacity="0.6" />

  <!-- Drawing Header -->
  <g font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="9" fill="#64748B" letter-spacing="1.5">
    <text x="24" y="28">FIG 04.1 // EXPLODED AXONOMETRIC SYSTEM</text>
    <text x="24" y="42">SCALE: 1:100 @ A1 // STRUCTURAL CAD SCHEMATIC</text>
    <line x1="24" y1="50" x2="220" y2="50" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <!-- Projection Vertical Alignment Axes (Dashed Orange) -->
  <g stroke="#FA7C3F" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8">
    <line x1="160" y1="95" x2="160" y2="395" />
    <line x1="330" y1="65" x2="330" y2="365" />
    <line x1="410" y1="125" x2="410" y2="425" />
    <line x1="240" y1="155" x2="240" y2="455" />
  </g>

  <!-- TIER 3: ROOF CANTILEVER & SOLAR PERGOLA (FLOATING) -->
  <g id="tier-roof" transform="translate(0, -30)">
    <text x="360" y="98" font-family="'Plus Jakarta Sans', monospace" font-size="8.5" fill="#FA7C3F" font-weight="600">LVL 03 [ROOF DECK]</text>
    <line x1="320" y1="95" x2="355" y2="95" stroke="#FA7C3F" stroke-width="0.8" stroke-dasharray="2 2" />

    <!-- Roof Slab (Isometric Box) -->
    <polygon points="240,150 410,120 410,128 240,158" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="160,100 240,150 240,158 160,108" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="240,150 410,120 330,70 160,100" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Pergola Steel Frame & Solar Louvers -->
    <g stroke="#334155" stroke-width="1.2">
      <line x1="220" y1="115" x2="280" y2="80" />
      <line x1="235" y1="124" x2="295" y2="89" />
      <line x1="250" y1="133" x2="310" y2="98" />
      <line x1="265" y1="142" x2="325" y2="107" />
      <line x1="215" y1="118" x2="215" y2="95" stroke-width="1.6" stroke="#0F172A" />
      <line x1="285" y1="77" x2="285" y2="55" stroke-width="1.6" stroke="#0F172A" />
      <line x1="330" y1="104" x2="330" y2="82" stroke-width="1.6" stroke="#0F172A" />
      <line x1="260" y1="145" x2="260" y2="122" stroke-width="1.6" stroke="#0F172A" />
      <polygon points="260,122 330,82 285,55 215,95" fill="none" stroke="#0F172A" stroke-width="1.5" />
    </g>
  </g>

  <!-- TIER 2: SECOND FLOOR RESIDENTIAL SUITE (FLOATING) -->
  <g id="tier-level2" transform="translate(0, 80)">
    <text x="360" y="132" font-family="'Plus Jakarta Sans', monospace" font-size="8.5" fill="#FA7C3F" font-weight="600">LVL 02 [LIVING SUITE]</text>
    <line x1="320" y1="128" x2="355" y2="128" stroke="#FA7C3F" stroke-width="0.8" stroke-dasharray="2 2" />

    <!-- Level 2 Floor Slab -->
    <polygon points="240,165 410,135 410,143 240,173" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" />
    <polygon points="160,115 240,165 240,173 160,123" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8" />
    <polygon points="240,165 410,135 330,85 160,115" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8" />

    <!-- Glass Curtain Facade -->
    <polygon points="240,165 370,142 370,95 240,118" fill="#F0FDF4" fill-opacity="0.3" stroke="#0F172A" stroke-width="1.5" />
    <line x1="283" y1="157" x2="283" y2="110" stroke="#64748B" stroke-width="1" />
    <line x1="326" y1="150" x2="326" y2="103" stroke="#64748B" stroke-width="1" />

    <!-- Orange Architectural Accent Panel -->
    <polygon points="160,115 240,165 240,118 160,68" fill="#FFF7ED" stroke="#FA7C3F" stroke-width="1.8" />
    <line x1="180" y1="102" x2="180" y2="127" stroke="#EA580C" stroke-width="1.2" />
    <line x1="200" y1="115" x2="200" y2="140" stroke="#EA580C" stroke-width="1.2" />
    <line x1="220" y1="127" x2="220" y2="152" stroke="#EA580C" stroke-width="1.2" />

    <!-- Cantilever Glass Railing -->
    <polygon points="370,142 410,135 410,115 370,122" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="3 1.5" />
  </g>

  <!-- TIER 1: GROUND FLOOR STRUCTURAL PLINTH & ENTRANCE -->
  <g id="tier-ground" transform="translate(0, 215)">
    <text x="360" y="165" font-family="'Plus Jakarta Sans', monospace" font-size="8.5" fill="#FA7C3F" font-weight="600">LVL 01 [GROUND PAVILION]</text>
    <line x1="320" y1="160" x2="355" y2="160" stroke="#FA7C3F" stroke-width="0.8" stroke-dasharray="2 2" />

    <!-- Foundation Slab -->
    <polygon points="240,185 430,150 430,165 240,200" fill="#E2E8F0" stroke="#0F172A" stroke-width="2" />
    <polygon points="130,120 240,185 240,200 130,135" fill="#CBD5E1" stroke="#0F172A" stroke-width="2" />
    <polygon points="240,185 430,150 320,85 130,120" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />

    <!-- Ground Floor Glass Pavilion & Core -->
    <polygon points="180,150 290,175 290,115 180,90" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.6" />
    <polygon points="290,175 390,157 390,97 290,115" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.6" />

    <!-- Columns -->
    <g stroke="#0F172A" stroke-width="2.2">
      <line x1="190" y1="152" x2="190" y2="95" />
      <line x1="240" y1="164" x2="240" y2="107" />
      <line x1="290" y1="175" x2="290" y2="118" />
      <line x1="340" y1="166" x2="340" y2="109" />
      <line x1="390" y1="157" x2="390" y2="100" />
    </g>

    <!-- Stairs Stringers & Steps -->
    <g stroke="#0F172A" stroke-width="1.4">
      <line x1="385" y1="160" x2="430" y2="90" stroke-width="2" />
      <line x1="395" y1="163" x2="440" y2="93" stroke-width="2" />
      <line x1="388" y1="155" x2="398" y2="158" />
      <line x1="395" y1="145" x2="405" y2="148" />
      <line x1="402" y1="135" x2="412" y2="138" />
      <line x1="409" y1="125" x2="419" y2="128" />
      <line x1="416" y1="115" x2="426" y2="118" />
      <line x1="423" y1="105" x2="433" y2="108" />
      <line x1="390" y1="135" x2="435" y2="65" stroke="#FA7C3F" stroke-width="1.6" />
    </g>
  </g>

  <!-- Dimension Indicator & North / Axis Arrows -->
  <g transform="translate(24, 485)">
    <!-- 3D Coordinate Arrows -->
    <line x1="20" y1="20" x2="52" y2="5" stroke="#FA7C3F" stroke-width="1.5" />
    <text x="56" y="6" font-family="'Plus Jakarta Sans', monospace" font-size="9" fill="#FA7C3F" font-weight="bold">X</text>
    <line x1="20" y1="20" x2="20" y2="-10" stroke="#0F172A" stroke-width="1.5" />
    <text x="17" y="-14" font-family="'Plus Jakarta Sans', monospace" font-size="9" fill="#0F172A" font-weight="bold">Z</text>
    <line x1="20" y1="20" x2="-8" y2="5" stroke="#64748B" stroke-width="1.5" />
    <text x="-18" y="6" font-family="'Plus Jakarta Sans', monospace" font-size="9" fill="#64748B" font-weight="bold">Y</text>

    <!-- Scale Bar -->
    <g transform="translate(85, 12)" font-family="'Plus Jakarta Sans', monospace" font-size="8" fill="#64748B">
      <line x1="0" y1="5" x2="70" y2="5" stroke="#0F172A" stroke-width="1.5" />
      <line x1="0" y1="2" x2="0" y2="8" stroke="#0F172A" stroke-width="1" />
      <line x1="35" y1="2" x2="35" y2="8" stroke="#0F172A" stroke-width="1" />
      <line x1="70" y1="2" x2="70" y2="8" stroke="#0F172A" stroke-width="1" />
      <text x="0" y="-2">0</text>
      <text x="30" y="-2">5m</text>
      <text x="65" y="-2">10m</text>
    </g>
  </g>
</svg>
